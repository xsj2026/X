<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码访问 · 开心肖笑乐</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FF6B8A">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #FFF5F5 0%, #FFE0E8 50%, #FFD4E0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 28px;
      padding: 40px 35px;
      box-shadow: 0 20px 60px rgba(255, 107, 138, 0.2);
      text-align: center;
      max-width: 480px;
      width: 100%;
      animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { font-size: 48px; margin-bottom: 12px; }
    h1 {
      font-size: 24px;
      color: #FF6B8A;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #999;
      margin-bottom: 28px;
    }
    #qrcode {
      display: inline-block;
      padding: 16px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      margin-bottom: 20px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #qrcode canvas { display: block; }
    
    .url-box {
      background: #FFF5F5;
      border: 1.5px dashed #FFB8C6;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 24px;
      word-break: break-all;
    }
    .url-box .label {
      font-size: 11px;
      color: #FF6B8A;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .url-box .url {
      font-size: 15px;
      color: #333;
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 600;
    }
    .copy-btn {
      background: linear-gradient(135deg, #FF6B8A, #FF8FA3);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(255, 107, 138, 0.3);
    }
    .copy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 107, 138, 0.4);
    }
    .copy-btn:active { transform: scale(0.96); }
    
    .steps {
      text-align: left;
      margin-top: 24px;
      padding: 18px 20px;
      background: #FAFAFA;
      border-radius: 14px;
    }
    .steps h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }
    .steps ol {
      list-style: none;
      counter-reset: step;
      padding: 0;
    }
    .steps li {
      counter-increment: step;
      font-size: 13px;
      color: #777;
      padding: 6px 0 6px 30px;
      position: relative;
      line-height: 1.6;
    }
    .steps li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 6px;
      width: 22px;
      height: 22px;
      background: #FF6B8A;
      color: white;
      border-radius: 50%;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .warning {
      margin-top: 16px;
      padding: 12px 16px;
      background: #FFF8E1;
      border-radius: 10px;
      font-size: 12px;
      color: #F57F17;
      line-height: 1.5;
    }
    .warning strong { color: #E65100; }

    /* 响应式 */
    @media (max-width: 480px) {
      .container { padding: 28px 20px; border-radius: 20px; }
      h1 { font-size: 20px; }
      .url-box .url { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🐰</div>
    <h1>开心肖笑乐工作台</h1>
    <p class="subtitle">手机扫码，即刻访问</p>

    <div id="qrcode">
      <p style="color:#ccc">正在生成二维码...</p>
    </div>

    <div class="url-box">
      <div class="label">📱 手机访问地址</div>
      <div class="url" id="urlText">检测中...</div>
    </div>

    <button class="copy-btn" onclick="copyUrl()">📋 复制链接</button>

    <div class="steps">
      <h3>📖 使用说明</h3>
      <ol>
        <li>确保手机和电脑连接<b>同一 WiFi</b></li>
        <li>用手机相机扫码（或微信扫一扫）</li>
        <li>在浏览器中打开链接</li>
        <li>添加到手机主屏幕即可像 App 一样使用</li>
      </ol>
    </div>

    <div class="warning">
      <strong>⚠️ 提示：</strong>如果二维码无法打开，请检查防火墙是否允许端口 8765 的入站连接。
      手机和电脑必须在同一局域网内。
    </div>
  </div>

  <script>
    // ===== 自动检测 IP 并生成二维码 =====
    (function() {
      const urlText = document.getElementById('urlText');
      const qrcodeEl = document.getElementById('qrcode');
      const PORT = 8765;

      // 如果本地运行，从当前 origin 获取
      const currentOrigin = window.location.origin;
      const isLocalFile = currentOrigin === 'null' || currentOrigin.startsWith('file://');
      
      if (!isLocalFile && !currentOrigin.includes('localhost') && !currentOrigin.includes('127.0.0.1')) {
        // 已经通过局域网访问
        const url = currentOrigin + '/cover.html';
        urlText.textContent = url;
        renderQR(url);
        return;
      }

      // 如果 localhost 访问，尝试获取本机 IP
      if (currentOrigin.includes('localhost') || currentOrigin.includes('127.0.0.1')) {
        // 用 WebRTC 获取局域网 IP
        getLocalIP().then(ip => {
          const url = 'http://' + ip + ':' + PORT + '/cover.html';
          urlText.textContent = url;
          renderQR(url);
        }).catch(() => {
          const url = currentOrigin + '/cover.html';
          urlText.textContent = '请使用菜单中的"显示二维码"查看真实地址';
          renderQR(url);
        });
      } else {
        urlText.textContent = '请在电脑上访问 http://localhost:8765/qr.html';
        qrcodeEl.innerHTML = '<p style="color:#999">⚠️ 请通过 HTTP 服务器访问此页面</p>';
      }

      function renderQR(url) {
        qrcodeEl.innerHTML = '';
        QRCode.toCanvas(url, { 
          width: 200, 
          margin: 2,
          color: {
            dark: '#FF6B8A',
            light: '#FFFFFF'
          }
        }, function(error, canvas) {
          if (error) {
            console.error(error);
            qrcodeEl.innerHTML = '<p style="color:#E74C3C">二维码生成失败</p>';
            return;
          }
          qrcodeEl.appendChild(canvas);
        });
      }

      function getLocalIP() {
        return new Promise((resolve, reject) => {
          const pc = new RTCPeerConnection({ iceServers: [] });
          const noop = () => {};
          pc.createDataChannel('');
          pc.createOffer().then(offer => pc.setLocalDescription(offer));
          pc.onicecandidate = (ice) => {
            if (!ice || !ice.candidate || !ice.candidate.candidate) return;
            const match = ice.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
            if (match) {
              const ip = match[0];
              if (ip.startsWith('192.168.') || ip.startsWith('10.') || ip.match(/^172\.(1[6-9]|2\d|3[01])\./)) {
                resolve(ip);
                pc.close();
              }
            }
          };
          setTimeout(() => reject(new Error('获取 IP 超时')), 3000);
        });
      }
    })();

    function copyUrl() {
      const url = document.getElementById('urlText').textContent;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(() => {
          alert('✅ 链接已复制！发送给朋友或在手机浏览器打开');
        }).catch(() => fallbackCopy(url));
      } else {
        fallbackCopy(url);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); alert('✅ 链接已复制！'); } 
      catch(e) { prompt('请手动复制链接：', text); }
      document.body.removeChild(ta);
    }
  </script>
</body>
</html>
